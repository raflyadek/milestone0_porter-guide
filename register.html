<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="register.css">
        <title>Porter Guide Indonesia</title>
    </head>

    <body>
        <main>
            <section class="register-content">
                <div class="register-page-text">
                    <h1>Register</h1>
                    <p>Already have an account?<span> <a href="./login.html">Login</a></span></p>
                </div>
                <form id="register-form">
                    <label for="username-register">Username or Email</label>
                    <br>
                    <input type="text" name="username" id="username">
                    <br>
                    <label for="password-register">Password</label>
                    <br>
                    <input type="password" name="password" id="password">
                    <br><br>
                    <button class="register-button" type="submit" onclick="">Register</button>
                </form>
            </section>
        </main>
        <script src="./register.js"></script>
    </body>
</html>
